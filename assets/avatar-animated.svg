<svg width="230" height="230" viewBox="0 0 230 230" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="circleClip">
      <circle cx="115" cy="115" r="88"/>
    </clipPath>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="35%" stop-color="#8957e5"/>
      <stop offset="70%" stop-color="#e3b341"/>
      <stop offset="100%" stop-color="#238636"/>
    </linearGradient>
  </defs>

  <!-- soft pulsing glow -->
  <circle cx="115" cy="115" r="100" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.35">
    <animate attributeName="r" values="98;108;98" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.05;0.35" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- rotating gradient ring -->
  <g>
    <circle cx="115" cy="115" r="102" fill="none" stroke="url(#ringGrad)" stroke-width="5"
            stroke-linecap="round" stroke-dasharray="480 160"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
                       from="0 115 115" to="360 115 115" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- photo, clipped to circle -->
  <image href="https://wsrv.nl/?url=github.com/lutherBenny.png&amp;w=200&amp;h=200&amp;fit=cover"
         x="27" y="27" width="176" height="176" clip-path="url(#circleClip)"/>
</svg>
